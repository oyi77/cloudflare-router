  social:
    mode: port
    enabled: true
    hostname: social.aitradepulse.com
    port: 6969
    health_check: /health
    # Backend :8202 (API), frontend :8201. :8200 is Vault, never proxy to it.
    # A boolean here makes nginx.js skip this app and delete its stale conf.
    custom_nginx: |-
      location /api/ {
          proxy_pass http://127.0.0.1:8202/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /docs {
          proxy_pass http://127.0.0.1:8202/docs;
      }
      location /health {
          proxy_pass http://127.0.0.1:8202/health;
      }
      location / {
          proxy_pass http://127.0.0.1:8201/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
